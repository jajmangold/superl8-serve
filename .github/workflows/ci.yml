name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check superl8serve/ tests/
      - run: ruff format --check superl8serve/ tests/

  cpu-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[dev]"
      - name: Run CPU tests
        run: pytest tests/ -q --tb=short -m "not cuda" --ignore=tests/test_e2e_serve_smoke.py --ignore=tests/test_qwen35_mtp_accept.py --ignore=tests/test_qwen35_mtp_netwin.py

  cuda-tests:
    runs-on: [self-hosted, sm70]
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        run: |
          pip install torch==2.10.0+cu129 --index-url https://download.pytorch.org/whl/cu129
          pip install -e ".[dev]"
          pytest tests/ -q --tb=short -x
